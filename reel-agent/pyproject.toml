[project]
name = "reel-agent"
version = "0.1.0"
description = "Turn raw photos and clips plus a one-line description into an edited product Reel."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.13"]
heic = ["pillow-heif>=0.16"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[project.scripts]
reel-agent = "reel_agent.cli:main"
reel-agent-web = "reel_agent.web.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reel_agent = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
