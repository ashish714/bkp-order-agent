[project]
name = "bkp-order-agent"
version = "0.1.0"
description = "BKP customer-support agent: order tracking, order details, refunds and FAQ, powered by Claude."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[project.scripts]
bkp-agent = "bkp_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bkp_agent = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
